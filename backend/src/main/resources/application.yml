spring:
  application:
    name: fintrack-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack
    username: fintrack
    password: ${DB_PASSWORD}  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  